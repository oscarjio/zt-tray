name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera beroenden
        run: python -m pip install -r requirements.txt
      - name: Tester
        run: |
          python -m unittest test_modbus_monitor test_modbus_extra
          python test_v24.py
          python test_v25.py
        env:
          ZT_SKIP_REAL_LLM: "1"
      - name: Bygg exe (PyInstaller via spec)
        run: python -m PyInstaller --noconfirm zt-tray.spec
      - name: Kontrollera exe
        shell: pwsh
        run: Get-Item dist\zt-tray.exe | Select-Object Length
      - uses: actions/upload-artifact@v4
        with:
          name: zt-tray
          path: dist/zt-tray.exe
      - name: Bifoga till release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/zt-tray.exe
          fail_on_unmatched_files: true
